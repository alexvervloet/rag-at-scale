services:
  pgvector:
    image: pgvector/pgvector:pg17
    container_name: rag-at-scale-pg
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag        # local-only dev database, never exposed
      POSTGRES_DB: ragscale
    ports:
      - "5433:5432"                 # 5433 to avoid clashing with any local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Millions of vectors want more shared memory than the container default.
    # Parallel HNSW builds allocate a dynamic-shared-memory segment sized to
    # maintenance_work_mem (we use 8GB at 5M), backed by /dev/shm — so this must
    # exceed that or CREATE INDEX fails with "No space left on device" on /dev/shm.
    shm_size: 12g
    command: >
      postgres
      -c shared_buffers=2GB
      -c maintenance_work_mem=1GB
      -c max_wal_size=4GB

volumes:
  pgdata:
